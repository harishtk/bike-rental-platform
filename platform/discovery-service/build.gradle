plugins {
    id("java")
    id("org.springframework.boot") version "3.5.16"
    id("io.spring.dependency-management") version "1.1.7"
}

group = 'com.bikerental.discovery'
version = '0.0.1-SNAPSHOT'

// Security overrides; revisit when upgrading Spring Boot and Spring Cloud.
ext['httpcore5.version'] = '5.4.3'
ext['tomcat.version'] = '10.1.59'

dependencyManagement {
    dependencies {
        dependency 'org.bouncycastle:bcprov-jdk18on:1.85'
    }
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-web")

    implementation(platform("org.springframework.cloud:spring-cloud-dependencies:2025.0.3"))
    implementation("org.springframework.cloud:spring-cloud-starter-netflix-eureka-server")
}

apply from: "${projectDir}/jacoco.gradle"

tasks.named('test') {
    useJUnitPlatform()
}