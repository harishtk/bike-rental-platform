server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            - id: bike-service
              uri: lb://bike-service
              predicates:
                - Path=/api/v1/bikes/**,/api/v1/stations/**

            - id: reservation-service
              uri: lb://reservation-service
              predicates:
                - Path=/api/v1/reservations/**

            - id: rental-service
              uri: lb://rental-service
              predicates:
                - Path=/api/v1/rentals/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://auth-service:8003}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8003/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoint:
    gateway:
      access: read-only

  endpoints:
    web:
      exposure:
        include: health,info,gateway