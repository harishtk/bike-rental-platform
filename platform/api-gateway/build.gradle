plugins {
    id("java")
    id("org.springframework.boot") version "3.5.16"
    id("io.spring.dependency-management") version "1.1.7"
}

group = 'com.bikerental.gateway'
version = '0.0.2-SNAPSHOT'

springBoot {
    buildInfo()
}

// Security overrides; revisit when upgrading Spring Boot and Spring Cloud.
ext['httpcore5.version'] = '5.4.3'
ext['netty.version'] = '4.1.137.Final'

dependencyManagement {
    dependencies {
        dependency 'org.bouncycastle:bcprov-jdk18on:1.85'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    implementation(platform("org.springframework.cloud:spring-cloud-dependencies:2025.0.3"))
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

apply from: "${projectDir}/jacoco.gradle"

tasks.named('test') {
    useJUnitPlatform()
}