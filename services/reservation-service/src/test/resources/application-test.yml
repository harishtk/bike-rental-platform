spring:
  jackson:
    time-zone: Asia/Kolkata

  jpa:
    properties:
      hibernate:
        default_schema: reservation
        jdbc:
          time_zone: Asia/Kolkata
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  datasource:
    hikari:
      maximum-pool-size: 5

  kafka:
    bootstrap-servers: localhost:9092

outbox:
  publisher:
    enabled: false

eureka:
  client:
    enabled: false

service-auth:
  client-id: reservation-service
  client-secret: test-reservation-secret

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bin: warn