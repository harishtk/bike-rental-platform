spring:
  application:
    name: reservation-service
  datasource:
    url: jdbc:postgresql://localhost:5431/rentaldb
    username: admin
    password: nopass
    driver-class-name: org.postgresql.Driver

    jpa:
    hibernate:
      ddl-auto: update   # options: none, validate, update, create, create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO

clients:
  bike-service:
    url: ${BIKE_SERVICE_URL:http://localhost:8080}

reservation:
  expiration:
    fixed-delay: 5000

feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      bike-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

server:
  port: 8081
