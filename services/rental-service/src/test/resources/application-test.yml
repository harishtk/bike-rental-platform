spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: rental
  flyway:
    enabled: true
  datasource:
    hikari:
      maximum-pool-size: 5

eureka:
  client:
    enabled: false

service-auth:
  client-id: rental-service
  client-secret: test-rental-secret

logging:
  level:
    org.hibernate.SQL: warn
