server:
  port: 8002

spring:
  application:
    name: rental-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/rentaldb?currentSchema=rental}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      properties:
        hibernate:
          default_schema: rental

  flyway:
    enabled: true
    schemas: rental
    default-schema: rental
    create-schemas: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://auth-service:8003}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8003/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

clients:
  bike-service:
    url: ${BIKE_SERVICE_URL:http://localhost:8000}