spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bikedb
    username: admin
    password: nopass
    driver-class-name: org.postgresql.Driver

  jpa:
  hibernate:
    ddl-auto: update   # options: none, validate, update, create, create-drop
