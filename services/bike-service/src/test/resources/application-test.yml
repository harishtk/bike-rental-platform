spring:
  jackson:
    time-zone: Asia/Kolkata

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  datasource:
    hikari:
      maximum-pool-size: 5

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bin: warn