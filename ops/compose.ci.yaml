services:

  # ============================================================
  # BIKE SERVICE
  # ============================================================

  bike-service:
    image: bike-rental/bike-service:${IMAGE_TAG:-local}
    pull_policy: never
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bike-db:5432/bikedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      EUREKA_URL: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

    depends_on:
      bike-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8000/actuator/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s


  bike-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bikedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Kolkata
    volumes:
      - bike_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d bikedb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ============================================================
  # RESERVATION SERVICE
  # ============================================================

  reservation-service:
    image: bike-rental/reservation-service:${IMAGE_TAG:-local}
    pull_policy: never
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://rental-db:5432/rentaldb?currentSchema=reservation
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      BIKE_SERVICE_URL: http://bike-service:8000

      EUREKA_URL: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      JWT_ISSUER: http://auth-service:8003
      JWT_JWK_SET_URI: http://auth-service:8003/.well-known/jwks.json

      OUTBOX_PUBLISHER_ENABLED: "true"

    depends_on:
      rental-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      bike-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8001/actuator/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s


  # ============================================================
  # RENTAL SERVICE
  # ============================================================

  rental-service:
    image: bike-rental/rental-service:${IMAGE_TAG:-local}
    pull_policy: never
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://rental-db:5432/rentaldb?currentSchema=rental
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      BIKE_SERVICE_URL: http://bike-service:8000

      EUREKA_URL: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

    depends_on:
      rental-db:
        condition: service_healthy
      bike-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8002/actuator/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s


  # ============================================================
  # SHARED RENTAL DB
  # reservation-service + rental-service
  # ============================================================

  rental-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rentaldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Kolkata
    volumes:
      - rental_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d rentaldb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ============================================================
  # AUTH SERVICE
  # ============================================================

  auth-service:
    image: bike-rental/auth-service:${IMAGE_TAG:-local}
    pull_policy: never
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      JWT_ISSUER: http://auth-service:8003
      JWT_ACCESS_TOKEN_TTL: 3600

      EUREKA_URL: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

    depends_on:
      auth-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8003/actuator/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s


  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d authdb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.5.0

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:29092 --list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s


  # ============================================================
  # DISCOVERY SERVICE
  # ============================================================

  discovery-service:
    image: bike-rental/discovery-service:${IMAGE_TAG:-local}
    pull_policy: never
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8761/eureka/apps"
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s


  # ============================================================
  # API GATEWAY
  # ============================================================

  api-gateway:
    image: bike-rental/api-gateway:${IMAGE_TAG:-local}
    pull_policy: never
    ports:
      - target: 8080
        host_ip: "127.0.0.1"
        protocol: tcp

    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      JWT_ISSUER: http://auth-service:8003
      JWT_JWK_SET_URI: http://auth-service:8003/.well-known/jwks.json

    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/actuator/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s


volumes:
  bike_db_data:
  rental_db_data:
  auth_db_data: