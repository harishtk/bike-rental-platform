name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify services
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check environment
        run: |
          java -version
          docker version
          docker compose version

      - name: Check Bash syntax
        run: bash -n ops/pipeline.sh

      - name: Verify services
        run: |
          mkdir -p build/pipeline
          bash ops/pipeline.sh verify 2>&1 \
            | tee build/pipeline/verify.log

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/pipeline/verify.log
            services/*/build/reports/
            services/*/build/test-results/
            services/*/build/jacocoHtml/
            platform/*/build/reports/
            platform/*/build/test-results/
            platform/*/build/jacocoHtml/
