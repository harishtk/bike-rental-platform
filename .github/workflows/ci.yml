name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify services
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check environment
        run: |
          java -version
          docker version
          docker compose version

      - name: Check Bash syntax
        run: |
          bash -n ops/pipeline.sh
          bash -n ops/scan-images.sh

      - name: Verify services
        run: |
          mkdir -p build/pipeline
          bash ops/pipeline.sh verify 2>&1 \
            | tee build/pipeline/verify.log

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/pipeline/verify.log
            services/*/build/reports/
            services/*/build/test-results/
            services/*/build/jacocoHtml/
            platform/*/build/reports/
            platform/*/build/test-results/
            platform/*/build/jacocoHtml/

  e2e:
    name: End-to-End Tests
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Docker images
        run: bash ops/pipeline.sh images ${{ github.sha }}

      - name: Scan Docker images
        run: bash ops/scan-images.sh "${{ github.sha }}"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: build/security/

      - name: Run E2E tests
        run: bash ops/pipeline.sh e2e ${{ github.sha }}

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: build/pipeline/bike-ci-*/

      - name: Publish tested images to GHCR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin

          registry_prefix="ghcr.io/${REPOSITORY,,}"

          services=(
            auth-service
            bike-service
            reservation-service
            rental-service
            discovery-service
            api-gateway
          )

          for service in "${services[@]}"; do
            source="bike-rental/$service:$IMAGE_TAG"
            target="$registry_prefix/$service:$IMAGE_TAG"

            docker image inspect "$source" >/dev/null
            docker tag "$source" "$target"
            docker push "$target"
          done
