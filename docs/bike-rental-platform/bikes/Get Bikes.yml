info:
  name: Get Bikes
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/bikes"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: stationId
      value: ""
      type: query
      disabled: true
    - name: status
      value: ""
      type: query
      disabled: true
    - name: page
      value: ""
      type: query
      disabled: true
    - name: size
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
