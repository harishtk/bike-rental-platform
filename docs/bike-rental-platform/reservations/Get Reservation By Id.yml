info:
  name: Get Reservation By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/reservations/<reservation-id-here>"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
