info:
  name: Create Reservation
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/reservations"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "bikeId": "<replace-bike-id>",
        "durationHours": 24
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
