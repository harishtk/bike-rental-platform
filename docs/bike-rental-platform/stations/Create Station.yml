info:
  name: Create Station
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/stations"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "name": "Central Station",
        "address": "12 MG Road, Bengaluru",
        "capacity": 25
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("stationId1", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
