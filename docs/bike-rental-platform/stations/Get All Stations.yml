info:
  name: Get All Stations
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/stations/"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("stationId1", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
