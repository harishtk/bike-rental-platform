info:
  name: Get Rentals
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/rentals"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
