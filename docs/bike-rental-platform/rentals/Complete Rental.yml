info:
  name: Complete Rental
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}/rentals/<rental-id-here>/complete"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
