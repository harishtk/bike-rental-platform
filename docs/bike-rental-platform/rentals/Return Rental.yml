info:
  name: Return Rental
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/rentals/<rental-id-here>/return"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "stationId": "<station-id-here>",
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
